<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contacto</title>
        <link rel="stylesheet" href="../css/main.css" />
    </head>
    <body>
        <nav>
            <div class="bloque de navegacion">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                </ul>
            </div>
        </nav>
        <main>
            <div class="imgBiografia">
                <img
                    src="../assets/img biografia 1366_2000.jpg"
                    alt="programando"
                />
            </div>

            <section class="contacto">
                <h1>Hablemos</h1>
            </section>

            <form action="formulario contacto" class="formulario">
                <div class="datos1">
                    <label for="name">Nombre</label>
                    <input
                        type="text"
                        id="name"
                        name="nombre"
                        placeholder="Tu nombre"
                    />

                    <label for="email">Correo electrónico:</label>
                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="correo@ejemplo.com"
                    />
                </div>
                <div class="messaje">
                    <textarea name="mensaje" id="mensaje">Mensaje</textarea>
                </div>

                <button type="submit">Enviar mensaje</button>
            </form>
        </main>

        <footer class="footerInicio">
            <div>
                <a href="">github</a>
                <a href="">Linkendin</a>
            </div>
            <p>&copy; 2026 Lizeth. Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
